syntax = "proto3";

package environment;

// Defines the gRPC service for managing execution environments
service EnvironmentManagerService {
  rpc ListEnvironments (ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
  rpc GetEnvironment (GetEnvironmentRequest) returns (EnvironmentDetail);
  rpc CreateEnvironment (CreateEnvironmentRequest) returns (EnvironmentDetail);
  rpc UpdateEnvironment (UpdateEnvironmentRequest) returns (EnvironmentDetail);
  rpc DeleteEnvironment (DeleteEnvironmentRequest) returns (DeleteEnvironmentResponse);
}

enum EnvironmentType {
  LOCAL = 0;
  DOCKER = 1;
  SSH = 2;
}

message EnvironmentConfig {
  EnvironmentType type = 1;
  string image = 2; // For DOCKER
  string host = 3; // For SSH
  string user = 4; // For SSH
  // Extra config encoded as JSON string (e.g. env variables, keys)
  string extra_config = 5;
}

message EnvironmentDetail {
  string id = 1;
  string name = 2;
  string description = 3;
  EnvironmentConfig config = 4;
  string created_at = 5;
  string updated_at = 6;
}

message ListEnvironmentsRequest {}

message ListEnvironmentsResponse {
  repeated EnvironmentDetail environments = 1;
}

message GetEnvironmentRequest {
  string id = 1;
}

message CreateEnvironmentRequest {
  string name = 1;
  string description = 2;
  EnvironmentConfig config = 3;
}

message UpdateEnvironmentRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  EnvironmentConfig config = 4;
}

message DeleteEnvironmentRequest {
  string id = 1;
}

message DeleteEnvironmentResponse {
  bool success = 1;
  string error_message = 2;
}

syntax = "proto3";

package vloop.system;

// The System interface is implemented by the Python Control Plane
// and called by the Rust Microkernel to manage lifecycles and tasks.
service SystemControl {
  // Check if the control plane is alive
  rpc HealthCheck (Ping) returns (Pong);
  
  // Update the control plane with a new active configuration
  rpc ReloadConfig (ReloadRequest) returns (ReloadResponse);

  // Dispatch an agent task to the control plane
  rpc DispatchTask (TaskRequest) returns (TaskResponse);

  // Periodic heartbeat from Python to Rust (or vice versa)
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);

  // Time-Travel: Commands Rust to reset a workspace git repository to a specific commit
  rpc RewindWorkspace (RewindRequest) returns (RewindResponse);

  // Background RAG: Streams new document text from Rust daemon to Python Vector Store
  rpc IngestDocument (IngestRequest) returns (IngestResponse);

  // Swarm Execution: Accept a remote task payload from another VLoop instance in the mesh
  rpc SwarmTask (SwarmRequest) returns (TaskResponse);

  // UI Bridge: Read the active DAG state for the React Frontend
  rpc GetWorkflowState (WorkflowStateRequest) returns (WorkflowStateResponse);
}

message Ping {}

message Pong {
  string status = 1;
}

message ReloadRequest {
  string config_path = 1;
}

message ReloadResponse {
  bool success = 1;
  string message = 2;
}

message TaskRequest {
  string task_id = 1;
  string objective = 2;
  int32 max_iterations = 3;
}

message SwarmRequest {
  string remote_node_id = 1;
  TaskRequest task = 2;
  bytes initial_workspace_tarball = 3;
}

message TaskResponse {
  bool success = 1;
  string message = 2;
  string artifact_path = 3;
  string served_url = 4;
}

message HeartbeatRequest {
  int64 timestamp = 1;
  string status = 2;
}

message HeartbeatResponse {
  bool acknowledged = 1;
}

message RewindRequest {
  string workspace_id = 1;
  string target_commit_hash = 2;
}

message RewindResponse {
  bool success = 1;
  string message = 2;
}

message IngestRequest {
  string file_path = 1;
  string content = 2;
}

message IngestResponse {
  bool success = 1;
  int32 chunks_embedded = 2;
}

message WorkflowStateRequest {
  string workflow_id = 1; // Optional
}

message DAGNode {
  string node_id = 1;
  string name = 2;
  string status = 3;
  string dependencies = 4;
  string payload = 5;
}

message WorkflowStateResponse {
  string workflow_id = 1;
  string objective = 2;
  string status = 3;
  repeated DAGNode nodes = 4;
}


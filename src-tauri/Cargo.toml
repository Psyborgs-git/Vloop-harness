[package]
name = "src-tauri"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dirs = "6.0.0"
hyper = { version = "1.10.1", features = ["full"] }
hyper-util = "0.1.20"
prost = "0.13.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.38.4"
tauri = "2.11.2"
tauri-plugin-store = "2.4.3"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
toml = "1.1.2"
tonic = "0.12"
tower = "0.5.3"
tower-service = "0.3.3"

[build-dependencies]
prost-build = "0.13.5"
tauri-build = "2.6.2"
tonic-build = "0.12"
